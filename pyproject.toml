[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-pc-screen-automation"
version = "0.1.0"
description = "Visible-screen PC automation framework with configurable recognition and input workflows"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
